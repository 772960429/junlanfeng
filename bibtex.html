    <script src="js/i18n.js"></script>
    <script>
        (function() {
            function showBibtex() {
                var pre = document.getElementById('bibtex-content');
                if (!pre) return;
                var content = '';
                // 优先从 URL hash 读取（点击 [BibTeX] 时通过 hash 传递内容）
                var hash = window.location.hash.replace(/^#/, '');
                if (hash) {
                    try {
                        content = decodeURIComponent(hash);
                    } catch (e) {
                        content = hash;
                    }
                }
                // 兜底：从 sessionStorage 读取
                if (!content) {
                    try {
                        content = sessionStorage.getItem('bibtex_content') || '';
                    } catch (e) {}
                }
                pre.textContent = content || 'BibTeX not available.';
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', showBibtex);
            } else {
                showBibtex();
            }
        })();
    </script>
